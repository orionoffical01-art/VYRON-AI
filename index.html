<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyron AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        header img {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
        }
        header h1 {
            color: #38bdf8;
            font-size: 1.5rem;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 80%;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #0284c7;
            color: white;
            border-bottom-right-radius: 0.2rem;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 0.2rem;
        }
        #input-container {
            padding: 1rem;
            background-color: #1e293b;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 0.8rem 1.5rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Vyron AI Logo">
        <h1>VYRON AI</h1>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            Merhaba! Ben Vyron AI. Size nasıl yardımcı olabilirim?
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir şeyler yazın..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        // BURASI: Google AI Studio'dan aldığın API anahtarını yapıştıracağın yer
        const API_KEY = "AQ.Ab8RN6IYg3WCOPv9vLMvYgG61kHd08B3vLVjDViDPDCByym_2g"; 

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // Kullanıcı mesajını ekrana bas
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.innerText = messageText;
            chatContainer.appendChild(userDiv);
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Yapay Zeka Cevap Alanı (Düşünüyor mesajı)
            const aiDiv = document.createElement("div");
            aiDiv.className = "message ai-message";
            aiDiv.innerText = "Düşünüyor...";
            chatContainer.appendChild(aiDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // API anahtarı kontrolü
            if (!API_KEY) {
                setTimeout(() => {
                    aiDiv.innerText = "API anahtarı henüz eklenmedi. Lütfen koddaki const API_KEY satırına anahtarınızı ekleyin.";
                }, 1000);
                return;
            }

            try {
                // GÜNCELLEME: En yeni Gemini modelini kullan (v2.0)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: messageText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    aiDiv.innerText = aiResponse;
                } else {
                    aiDiv.innerText = "Yapay zekadan yanıt alınamadı. Lütfen API kotanızı veya anahtarınızı kontrol edin.";
                }
            } catch (error) {
                aiDiv.innerText = "Bağlantı hatası oluştu. Lütfen internetinizi veya API anahtarınızı kontrol edin.";
            }

            // Sohbeti otomatik olarak en alta kaydır
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
